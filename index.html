<style>
    @keyframes slow-zoom {
        0% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
    .animate-slow-zoom {
        animation: slow-zoom 20s ease-out forwards;
    }
    
    @keyframes reveal {
        0% { transform: translateY(100%); }
        100% { transform: translateY(0); }
    }
    .reveal-text {
        animation: reveal 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
        animation: fade-in-up 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.5s forwards;
    }

    @keyframes scroll-line {
        0% { transform: translateY(-100%); }
        50% { transform: translateY(0); }
        100% { transform: translateY(100%); }
    }
    .animate-scroll-line {
        animation: scroll-line 2s infinite cubic-bezier(0.19, 1, 0.22, 1);
    }
    
    .mobile-menu-overlay {
        position: fixed;
        inset: 0;
        background: black;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
    }
    .mobile-menu-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }
    .mobile-menu-content {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        text-align: center;
    }
    .mobile-menu-content a {
        font-size: 2rem;
        font-weight: 900;
        text-transform: uppercase;
        text-decoration: none;
        color: white;
    }
    .mobile-menu-close {
        position: absolute;
        top: 2rem;
        right: 2rem;
        font-size: 2rem;
        cursor: pointer;
    }
</style>
